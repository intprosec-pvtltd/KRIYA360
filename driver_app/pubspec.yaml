version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  lucide_icons: ^0.257.0
